<style>
/* =============== TOKEN: 1 accento + grigi + 3 tinte + rosso errore =============== */
:root {
  --bg: #ffffff; --ink: #111827; --mut: #4b5563; --fill: #f1f3f6; --line: #e5e7eb; --off: #767676;
  --acc: #1d4ed8; --onacc: #ffffff;
  --t1: #e3ecfc; --t2: #c3d6f8; --t3: #9dbcf2; --tx: #1e3a8a; --t3x: #0f1f4d;
  --err: #b91c1c; --errbg: #fef2f2; --sheet: #ffffff; --toast: #111827; --ontoast: #ffffff;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a; --ink: #f1f5f9; --mut: #cbd5e1; --fill: #1e293b; --line: #334155; --off: #8391a7;
    --acc: #2563eb; --t1: #24334d; --t2: #34517f; --t3: #5b84c4; --tx: #dbeafe; --t3x: #0b1226;
    --err: #fca5a5; --errbg: #450a0a; --sheet: #172033; --toast: #e2e8f0; --ontoast: #0f172a;
  }
}
body.verde { --acc: #15803d; --t1: #e1f3e6; --t2: #bfe3c9; --t3: #8fcba2; --tx: #14532d; --t3x: #052e16; }
@media (prefers-color-scheme: dark) { body.verde { --acc: #16a34a; --t1: #1f3a2b; --t2: #2f6342; --t3: #4f9a69; --tx: #dcfce7; --t3x: #052e16; } }

/* =============== BASE =============== */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: 170px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.35 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; overflow-wrap: break-word; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-appearance: none; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; white-space: nowrap; }
.wrap { max-width: 480px; margin: 0 auto; padding-left: 16px; padding-left: calc(16px + env(safe-area-inset-left)); padding-right: 16px; padding-right: calc(16px + env(safe-area-inset-right)); }
.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; flex: none; }
.ico.s { width: 18px; height: 18px; } .ico.pieno { fill: currentColor; }

/* =============== TITOLO =============== */
header { padding-top: 20px; padding-top: calc(20px + env(safe-area-inset-top)); }
h1 { margin: 0; font-size: 22px; line-height: 1.15; letter-spacing: -.01em; }
.squig { display: block; width: 116px; height: 10px; margin: 2px 0 0 -2px; fill: none; stroke: var(--acc); stroke-width: 3; stroke-linecap: round; }
.loc { margin: 4px 0 0; color: var(--mut); font-size: 16px; }

/* =============== NOME + AVATAR =============== */
.nome { display: flex; align-items: center; margin-top: 18px; }
.avb { position: relative; width: 52px; height: 52px; margin-right: 10px; padding: 0; border: 0; border-radius: 50%; background: none; flex: none; }
.av { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 50%; background: var(--fill); color: var(--mut); font-weight: 700; font-size: 20px; overflow: hidden; flex: none; }
.av svg { width: 100%; height: 100%; display: block; }
.av.vuoto { background: var(--fill); }
.ok-b { position: absolute; right: -4px; bottom: -4px; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: var(--onacc); border: 3px solid var(--bg); }
.ok-b .ico { width: 14px; height: 14px; stroke-width: 3.4; }
.nome input { -webkit-box-flex: 1; flex: 1; min-width: 0; height: 52px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 12px; background: var(--bg); color: var(--ink); font: inherit; font-size: 18px; -webkit-appearance: none; }
.nome input:focus { outline: 3px solid var(--acc); outline-offset: 1px; }
.nome input[readonly] { border-color: transparent; background: var(--fill); font-weight: 600; }
.nome.err input { border-color: var(--err); }
.ib { display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; margin-left: 8px; border: 0; border-radius: 12px; background: var(--fill); color: var(--ink); flex: none; }
.sugg { list-style: none; margin: 6px 0 0; padding: 0; border-radius: 12px; background: var(--fill); overflow: hidden; }
.sugg button { display: flex; align-items: center; width: 100%; min-height: 48px; padding: 4px 12px; border: 0; border-top: 2px solid var(--bg); background: none; text-align: left; }
.sugg li:first-child button { border-top: 0; }
.sugg .av { width: 30px; height: 30px; margin-right: 10px; font-size: 14px; background: var(--bg); }
.sugg .gia { margin-left: auto; color: var(--acc); }
.sugg .lock { margin-left: auto; color: var(--mut); }
.sugg .lock + .gia { margin-left: 8px; }

/* =============== CALENDARIO UNICO =============== */
.mese { margin: 20px 0 6px; font-size: 16px; font-weight: 600; color: var(--mut); }
.cal { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) repeat(3, minmax(0, 1.45fr)); gap: 4px; }
.wd { text-align: center; font-size: 13px; font-weight: 600; color: var(--mut); padding-bottom: 2px; }
.g { position: relative; display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0; border: 0; border-radius: 12px; background: var(--fill); color: var(--ink); font-size: 17px; font-weight: 600; line-height: 1; -webkit-tap-highlight-color: transparent; }
.cal > :nth-child(7n+5), .cal > :nth-child(7n+6), .cal > :nth-child(7n) { font-size: 20px; }
.cal > .wd:nth-child(n) { font-size: 13px; }
.squig { margin-top: 5px; }
.g .o { position: absolute; top: 3px; right: 6px; font-size: 13px; font-style: normal; font-weight: 600; color: var(--tx); }
.g.t1 { background: var(--t1); } .g.t2 { background: var(--t2); } .g.t3 { background: var(--t3); color: var(--t3x); } .g.t3 .o { color: var(--t3x); }
.g.m { background: var(--acc); color: var(--onacc); font-weight: 800; } .g.m .o { color: var(--onacc); opacity: .85; }
.g.f .fq { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 700; }
.g.x { background: none; color: var(--off); font-weight: 400; text-decoration: line-through; pointer-events: none; }
.g.oggi { box-shadow: inset 0 0 0 2px var(--ink); }
.g.foc { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); z-index: 1; }
.g:active { -webkit-transform: scale(.95); transform: scale(.95); }
.g.chiuso-adm { text-decoration: line-through; color: var(--off); background: none; }
.g.aperto-adm { background: var(--acc); color: var(--onacc); }
.g.vuoto { visibility: hidden; }

/* =============== BARRA IN BASSO =============== */
.bar { position: -webkit-sticky; position: sticky; bottom: 0; z-index: 3; margin: 16px -16px 0; padding: 10px 16px 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); background: var(--bg); box-shadow: 0 -1px 0 var(--line); }
.riga { display: flex; align-items: stretch; }
.invia { -webkit-box-flex: 1; flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 56px; padding: 0 16px; border: 0; border-radius: 14px; background: var(--acc); color: var(--onacc); font-size: 20px; font-weight: 700; white-space: nowrap; }
.invia .n { margin-left: 8px; font-weight: 600; opacity: .9; }
.invia .n:before { content: "·"; margin-right: 8px; }
.invia[aria-disabled="true"] { background: var(--fill); color: var(--mut); }
.invia.cambia { background: var(--fill); color: var(--ink); }
.invia .ico { margin-right: 8px; }
.invia.lavora { background: var(--acc); color: var(--onacc); }
.spin { width: 20px; height: 20px; margin-right: 10px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; -webkit-animation: gira .8s linear infinite; animation: gira .8s linear infinite; }
@-webkit-keyframes gira { to { -webkit-transform: rotate(360deg); } } @keyframes gira { to { transform: rotate(360deg); } }
.bar .ib { width: 56px; height: 56px; margin: 0 8px 0 0; border-radius: 14px; position: relative; }
.bar .ib .pt { position: absolute; top: 9px; right: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--acc); }
body.invio #nomeblk, body.invio #cal { opacity: .55; pointer-events: none; }
.chiave-r { display: flex; align-items: center; margin-bottom: 8px; }
.chiave-r .ico { margin-right: 10px; color: var(--mut); }
.chiave-r input { -webkit-box-flex: 1; flex: 1; min-width: 0; height: 48px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--fill); color: var(--ink); font: inherit; }
.chiave-r.err input { box-shadow: inset 0 0 0 2px var(--err); }
.chiave-r .em { margin-left: 8px; color: var(--err); font-weight: 700; font-size: 15px; }

/* pannello del giorno (2o tocco) */
.pan { margin-bottom: 8px; padding: 10px 12px; border-radius: 16px; background: var(--fill); max-height: 220px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pan-t { display: flex; align-items: center; font-weight: 700; }
.pan-t .x { margin-left: auto; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -8px; border: 0; background: none; font-size: 26px; line-height: 1; color: var(--mut); }
.ctrl { display: flex; align-items: center; margin-top: 4px; }
.seg { display: flex; -webkit-box-flex: 1; flex: 1; padding: 3px; border-radius: 12px; background: var(--bg); }
.seg + .seg { -webkit-box-flex: 0; flex: 0 0 38%; margin-left: 8px; }
.seg button { -webkit-box-flex: 1; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0; border: 0; border-radius: 10px; background: none; color: var(--mut); font-weight: 700; font-size: 17px; }
.seg button[aria-pressed="true"] { background: var(--acc); color: var(--onacc); }
.seg button .ico { width: 22px; height: 22px; } .seg button .ico + .ico { margin-left: 2px; }
.chips { display: flex; flex-wrap: wrap; margin: 6px -3px 0; }
.chip { display: inline-flex; align-items: center; margin: 3px; padding: 3px 12px 3px 3px; border: 0; border-radius: 999px; background: var(--bg); color: var(--ink); font-size: 15px; }
.chip .av { width: 26px; height: 26px; margin-right: 6px; font-size: 13px; }
.chip.forse { box-shadow: inset 0 0 0 1.5px var(--mut); }
.chip.forse:after { content: "?"; margin-left: 4px; font-weight: 700; }
.chip.lo { box-shadow: inset 0 0 0 2px var(--acc); }

/* toast "annulla" */
.toast { display: flex; align-items: center; margin-bottom: 8px; padding: 4px 4px 4px 16px; border-radius: 14px; background: var(--toast); color: var(--ontoast); font-size: 17px; -webkit-animation: sale .2s ease-out; animation: sale .2s ease-out; }
.toast span { -webkit-box-flex: 1; flex: 1; }
.toast button { min-height: 44px; padding: 0 14px; border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; }
@-webkit-keyframes sale { from { opacity: 0; -webkit-transform: translateY(10px); } } @keyframes sale { from { opacity: 0; transform: translateY(10px); } }

/* =============== FOGLI =============== */
.velo { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 8; background: rgba(15,23,42,.45); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; max-width: 480px; max-height: 85%; margin: 0 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 16px 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom)); border-radius: 20px 20px 0 0; background: var(--sheet); -webkit-animation: sale .2s ease-out; animation: sale .2s ease-out; }
.mani { width: 40px; height: 5px; margin: 0 auto 8px; border-radius: 3px; background: var(--line); }
.sh-t { display: flex; align-items: center; margin: 0 0 6px; font-size: 19px; font-weight: 700; }
.sh-t .x { margin-left: auto; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -8px; border: 0; background: none; font-size: 28px; line-height: 1; color: var(--mut); }
.sheet textarea { width: 100%; min-height: 84px; padding: 12px 14px; border: 0; border-radius: 12px; background: var(--fill); color: var(--ink); font: inherit; resize: none; }
.sheet .seg { background: var(--fill); margin-top: 10px; -webkit-box-flex: 0; flex: none; width: 100%; }
.sheet .seg button .ico { margin-right: 6px; }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.grid button { position: relative; padding: 0; border: 0; border-radius: 50%; background: none; }
.grid .av { width: 100%; height: auto; padding-top: 100%; position: relative; } .grid .av > * { position: absolute; top: 0; left: 0; }
.grid .av svg { width: 100%; height: 100%; } .grid .av.ini { display: flex; }
.grid button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--sheet), 0 0 0 6px var(--acc); }
.riga-a { display: flex; align-items: center; width: 100%; min-height: 54px; padding: 0 6px; border: 0; border-radius: 12px; background: none; font-size: 18px; text-align: left; }
.riga-a .ico { margin-right: 14px; color: var(--mut); }
.riga-a .n { margin-left: auto; color: var(--mut); }
.riga-a.del { color: var(--err); } .riga-a.del .ico { color: var(--err); }
.hint { margin: 6px 0 0; color: var(--mut); font-size: 15px; }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; margin-top: 12px; border: 0; border-radius: 14px; background: var(--acc); color: var(--onacc); font-size: 19px; font-weight: 700; }
.btn.sec { background: var(--fill); color: var(--ink); }
.btn.del { background: var(--fill); color: var(--err); }
.duo { display: flex; } .duo .btn + .btn { margin-left: 8px; } .duo .btn { -webkit-box-flex: 1; flex: 1; min-width: 0; }
.sheet input[type=text], .sheet input[type=date] { width: 100%; height: 52px; margin-top: 8px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--fill); color: var(--ink); font: inherit; }
.lista { list-style: none; margin: 0; padding: 0; }
.pers { display: flex; align-items: center; width: 100%; min-height: 56px; padding: 4px 4px; border: 0; border-radius: 12px; background: none; font-size: 18px; text-align: left; }
.pers .av { width: 38px; height: 38px; margin-right: 12px; font-size: 16px; }
.pers b { -webkit-box-flex: 1; flex: 1; min-width: 0; font-weight: 600; }
.pers .q { color: var(--mut); font-size: 15px; margin-left: 8px; }
.pers .ico { color: var(--mut); margin-left: 8px; }
.pers[aria-expanded="true"] { background: var(--fill); }
.dett { margin: 0 0 8px 50px; }
.mini { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; min-height: 48px; margin: 2px 4px 2px 0; border-radius: 10px; background: var(--acc); color: var(--onacc); font-size: 13px; line-height: 1.1; font-weight: 600; }
.mini b { font-size: 17px; } .mini.f { background: var(--t2); color: var(--tx); }
.mini .ico { width: 13px; height: 13px; }
.cit { margin: 6px 0 0; padding: 8px 12px; border-radius: 12px; background: var(--fill); font-size: 16px; }
.cit .ico { width: 16px; height: 16px; margin-right: 6px; color: var(--mut); }
.uscita { opacity: .4; text-decoration: line-through; }
.rad { display: flex; align-items: center; width: 100%; min-height: 56px; padding: 4px 6px; border: 0; border-radius: 12px; background: none; font-size: 18px; text-align: left; }
.rad[aria-pressed="true"] { background: var(--fill); box-shadow: inset 0 0 0 2px var(--acc); }
.rad .mini { margin-right: 12px; }

/* =============== ADMIN: barra sottile =============== */
.adm { position: -webkit-sticky; position: sticky; top: 0; z-index: 7; background: var(--ink); color: var(--bg); }
.adm .in { display: flex; align-items: center; max-width: 480px; margin: 0 auto; padding-top: env(safe-area-inset-top); }
.adm button { -webkit-box-flex: 1; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 46px; border: 0; background: none; color: inherit; font-size: 16px; font-weight: 600; }
.adm button .ico { margin-right: 6px; width: 20px; height: 20px; }
.adm .ee { -webkit-box-flex: 0; flex: 0 0 64px; }

/* =============== DATA SCELTA =============== */
.decisa { margin: 28px 0 0; text-align: center; }
.grande { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 112px; height: 120px; border-radius: 20px; background: var(--acc); color: var(--onacc); line-height: 1.05; font-weight: 700; }
.grande span { font-size: 18px; } .grande b { font-size: 52px; }
.decisa .lk { display: flex; align-items: center; justify-content: center; margin-top: 12px; color: var(--mut); }
.decisa .lk .ico { margin-right: 6px; }

/* =============== ADATTAMENTI =============== */
body.kb .bar { position: relative; box-shadow: none; }
@media (max-height: 500px) {
  header { padding-top: 8px; padding-top: calc(8px + env(safe-area-inset-top)); } h1 { font-size: 19px; } .squig { display: none; } .loc { margin-top: 2px; }
  .nome { margin-top: 8px; } .mese { margin-top: 10px; }
  .bar { padding-top: 6px; padding-bottom: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); } .invia, .bar .ib { min-height: 48px; height: 48px; }
  .pan { display: flex; flex-wrap: wrap; align-items: center; max-height: none; margin-bottom: 6px; padding: 4px 10px; }
  .pan-t { margin-right: 12px; } .pan-t .x { margin-left: 8px; order: 5; }
  .ctrl { -webkit-box-flex: 1; flex: 1; margin: 0; min-width: 0; } .seg button { min-height: 40px; }
  .chips { -webkit-box-flex: 0; flex: 0 0 100%; flex-wrap: nowrap; overflow-x: auto; margin: 0 0 2px; -webkit-overflow-scrolling: touch; } .chip { flex: none; }
}
@media (max-width: 300px) { .wrap { padding-left: 8px; padding-right: 8px; } .bar { margin-left: -8px; margin-right: -8px; padding-left: 8px; padding-right: 8px; } .cal { gap: 2px; } .g, .cal > :nth-child(7n+5), .cal > :nth-child(7n+6), .cal > :nth-child(7n) { font-size: 15px; min-height: 44px; } .g .o { right: 2px; } .invia { font-size: 18px; padding: 0 8px; } }
@media (prefers-reduced-motion: reduce) { .spin, .toast, .sheet, .g:active { -webkit-animation: none; animation: none; -webkit-transform: none; transform: none; } }
/* aspetto (admin): mano libera = titolo, sottolineatura e avatar leggermente irregolari. Mai sui comandi. */
body.mano .squig, body.mano .av svg, body.mano h1 { -webkit-filter: url(#mano); filter: url(#mano); }
body.mano .squig { stroke-width: 4; }
body.pesi .cal { grid-template-columns: repeat(7, minmax(0, 1fr)); } body.pesi .cal > * { font-size: 17px !important; }

.sheet .qs{margin:10px 0 6px;font-size:15px;font-weight:700;color:var(--mut)}

.sheet.sx{padding-top:58px}
.sheet.sx .mani{position:absolute;top:8px;left:50%;margin-left:-20px}

.sheet .xc{position:absolute;top:10px;right:12px;z-index:2;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--fill);color:var(--ink);font-size:26px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}

@-webkit-keyframes accendi{0%,100%{background-color:#d5d9df;opacity:.28}50%{background-color:#8f98a5;opacity:1}}
@keyframes accendi{0%,100%{background-color:#d5d9df;opacity:.28}50%{background-color:#8f98a5;opacity:1}}
.carico .g[data-g]{background-image:none;background-color:#dfe3e8;color:transparent;pointer-events:none;opacity:.72}
.carico .g.sk-onda{-webkit-animation:accendi 2.4s ease-in-out infinite;animation:accendi 2.4s ease-in-out infinite}
.carico .g.sk-ferma{-webkit-animation:accendi 2.4s ease-in-out -1.2s infinite;animation:accendi 2.4s ease-in-out -1.2s infinite}
.carico .g[data-g] .o{opacity:0}
.caricamento{display:flex;align-items:center;justify-content:center;min-height:44px;margin:0 0 8px;color:var(--ink);font-weight:700}
.caricamento .spin{flex:none;border-color:var(--line);border-top-color:var(--acc)}
@media (prefers-color-scheme:dark){@-webkit-keyframes accendi{0%,100%{background-color:#20242a;opacity:.3}50%{background-color:#4b535f;opacity:1}}@keyframes accendi{0%,100%{background-color:#20242a;opacity:.3}50%{background-color:#4b535f;opacity:1}}.carico .g[data-g]{background-color:#343a43}}
@media (prefers-reduced-motion:reduce){.carico .g[data-g]{-webkit-animation:none;animation:none}}

.cbox{margin-top:8px;border:2px solid var(--fill);border-radius:12px;overflow:hidden;background:var(--bg)}
.sheet .cbox .dnote{margin:0;border:0;border-radius:0;background:transparent}
.sheet .cbox .seg.vis{margin:0;border-radius:0;background:var(--fill)}
.sheet .cbox .seg.vis button{font-size:14px}
.sheet .cbox .seg.vis button .ico{width:18px;height:18px;margin-right:6px}
.sheet .seg button[data-sf="si"][aria-pressed="true"]{background:#15803d;color:#fff}
.sheet .seg button[data-sf="forse"][aria-pressed="true"]{background:#c2410c;color:#fff}

.mcal{margin:2px 0 6px}
.mm{font-size:13px;font-weight:700;color:var(--mut);text-transform:capitalize;margin:6px 0 2px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mg .mv,.mg .mo,.mg .mc{height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:15px;box-sizing:border-box}
.mg .mo{color:var(--t3,#b0b6c0)}
.mg .mc{border:0;padding:0;background:var(--fill);color:var(--ink);font-weight:700;-webkit-tap-highlight-color:transparent}
.mg .mc{position:relative}
.cn{position:absolute;top:5px;left:5px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85;pointer-events:none}
.mg .mc .cn{left:auto;right:5px}
.chip.conn{display:flex;width:100%;box-sizing:border-box;align-items:flex-start;border-radius:16px;padding:6px 12px 6px 6px}
.chip.conn .av{flex:none}
.chip.conn .cb{display:flex;flex-direction:column;min-width:0;text-align:left}
.chip .cn2{font-weight:700}
.chip .ct{font-size:14px;color:var(--mut);white-space:normal;overflow-wrap:anywhere;word-wrap:break-word}
.sheet .seg.vis{margin-top:8px}
.mg .mc[aria-pressed="true"]{background:var(--acc);color:var(--onacc)}

.slitta{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0}
.slitta .pg{flex:none;width:100%;box-sizing:border-box;padding:0 16px;scroll-snap-align:center}

.sh-t .x{width:44px;height:44px;margin-right:0;border-radius:50%;background:var(--fill);border:1.5px solid var(--line);color:var(--ink);font-size:26px;font-weight:600}

/* aggiunte del codice (stati che il prototipo non mostra) */
.errbox { margin-bottom: 8px; padding: 10px 12px; border-radius: 12px; background: var(--errbg); color: var(--err); font-weight: 700; font-size: 16px; }
.fila-c { overflow: visible; padding: 4px 4px 4px 10px; }
.fila-b { overflow: visible; }
.sheet .seg button { font-size: 14px; padding: 0 2px; white-space: nowrap; }
.ctrl { flex-wrap: wrap; } .ctrl .seg:first-child { -webkit-box-flex: 1; flex: 1 1 100%; margin-bottom: 8px; } .ctrl .seg + .seg { -webkit-box-flex: 1; flex: 1 1 0; margin-left: 0; }
.seg button.t { font-size: 15px; }
.g .fq { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 700; }

.sheet .dnote { display: block; width: 100%; box-sizing: border-box; min-height: 44px; margin-top: 8px; padding: 10px 12px; font: inherit; font-size: 16px; border: 2px solid var(--fill); border-radius: 12px; background: var(--fill); color: var(--ink); resize: none; }
.bar .ib .pt.nuovo { -webkit-animation: pmp 1.1s ease-in-out 2; animation: pmp 1.1s ease-in-out 2; }

@keyframes pmp { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

.gc { -webkit-tap-highlight-color: transparent; flex: none; min-height: 44px; margin-right: 8px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--fill); color: var(--ink); font-size: 16px; font-weight: 700; }

.nome input:focus { outline: none; border-color: var(--acc); }
.av.vuoto .ico { width: 55%; height: 55%; color: var(--mut); }
.fila-b { display: flex; align-items: center; max-width: 100%; min-height: 44px; margin-right: -4px; padding: 0; border: 0; background: none; color: var(--mut); }
.fila-c { display: flex; align-items: center; min-width: 0; padding-left: 8px; overflow: visible; }
.fl { position: relative; flex: none; width: 30px; height: 30px; margin-left: -8px; border-radius: 50%; box-shadow: 0 0 0 2px var(--bg); background: var(--bg); }
.fl .av { width: 100%; height: 100%; font-size: 14px; }
.fl.io { z-index: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--acc); }
.fl-ok { position: absolute; right: -5px; bottom: -4px; display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--acc); color: var(--onacc); border: 2px solid var(--bg); }
.fl-ok .ico { width: 10px; height: 10px; stroke-width: 3.6; }
.fl-piu { display: flex; align-items: center; justify-content: center; background: var(--fill); color: var(--mut); font-size: 12px; font-weight: 700; }
.fila-n { display: flex; align-items: center; gap: 4px; margin-left: 10px; font-size: 16px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.fila-n .ico { width: 16px; height: 16px; }
.cambia-nome { display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 64px); min-height: 44px; margin: 8px 0 0 64px; }
.cambia-nome .ico { width: 18px; height: 18px; }
.inv.manca .pers { opacity: .5; }
.inv .pers .gia { color: var(--acc); margin-left: 8px; }
header .wrap { position: relative; }
header h1 { padding-right: 50px; }
#persona { position: absolute; top: 0; right: 4px; top: calc(env(safe-area-inset-top)); width: 48px; height: 48px; margin: 8px 0 0; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--mut); display: flex; align-items: center; justify-content: center; }
#persona .ico { width: 22px; height: 22px; }
.g .o.sk { width: 14px; height: 8px; border-radius: 4px; background: var(--line); -webkit-animation: resp 1.2s ease-in-out infinite; animation: resp 1.2s ease-in-out infinite; }
@-webkit-keyframes resp { 50% { opacity: .4; } } @keyframes resp { 50% { opacity: .4; } }

.invia .ico { width: 22px; height: 22px; }
.bar .ib:not([aria-disabled]) .ico{color:var(--acc)}
.bar .ib{background:var(--acc)}
.bar .ib .ico,.bar .ib:not([aria-disabled]) .ico{color:var(--onacc)}

    }

    du.appendChild(ok); du.appendChild(no); s.appendChild(du);

function sheetData() {
  sheet('Scegli la data', function (s) {
    var tot = {}; TUTTI.forEach(function (g) { tot[g] = (VOTI || []).filter(function (v) { return v.giorni[g] && parti(v.giorni[g]).si; }).length; });
    var top = TUTTI.filter(function (g) { return aperti.indexOf(g) >= 0 && g >= OGGI; }).sort(function (a, b) { return tot[b] - tot[a] || (a < b ? -1 : 1); }).slice(0, 3), sel = top[0], bts = [];
    top.forEach(function (g) {
      var b = el('button', 'rad'); b.type = 'button'; b.setAttribute('data-g', g); b.setAttribute('aria-pressed', g === sel ? 'true' : 'false');
      var m = el('span', 'mini'); m.appendChild(el('span', '', dl(g, { weekday: 'short' }))); m.appendChild(el('b', '', String(+g.slice(8)))); b.appendChild(m);
      b.appendChild(document.createTextNode(dl(g, { weekday: 'long', day: 'numeric', month: 'long' }))); var cn = el('span', '', String(tot[g])); cn.style.cssText = 'margin-left:auto;color:var(--mut)'; b.appendChild(cn);
      b.addEventListener('click', function () { sel = g; bts.forEach(function (x) { x[0].setAttribute('aria-pressed', x[1] === g ? 'true' : 'false'); }); }); bts.push([b, g]); s.appendChild(b);

    var ok = el('button', 'btn'); ok.type = 'button'; ok.id = 'chiudi-voti'; ok.appendChild(ico('lucchetto')); ok.firstChild.style.marginRight = '8px'; ok.appendChild(document.createTextNode('Chiudi i voti'));
    ok.addEventListener('click', function () {
      if (!sel) return; var scelta = sel; closeSheet();
      deveOk({ azione: 'scegliData', data: scelta }).then(function () { DECISA = scelta; S.focus = ''; renderAll(); toast(dl(scelta, { weekday: 'short', day: 'numeric', month: 'short' }) + ' scelto', riapri); }, function (e) { toast('Non riuscito: ' + umano(e)); });
    });

}
function riapri() {
  var era = DECISA;
  return deveOk({ azione: 'riapri' }).then(function () { DECISA = ''; applicaVotoMio(); renderAll(); toast('Voti riaperti', function () { return deveOk({ azione: 'scegliData', data: era }).then(function () { DECISA = era; renderAll(); }); }); }, function (e) { toast('Non riuscito: ' + umano(e)); });

function sheetCestino() {

function sheetAspetto() { // tocco = anteprima solo qui; "Applica a tutti" salva; "Annulla" torna al salvato
  sheet('Aspetto', function (s) {
    var scelta = Object.assign({}, aspettoSalvato);
    Object.keys(ASPETTO_OPZIONI).forEach(function (k) {
      var nomi = ASPETTO_NOMI[k], sg = el('div', 'seg'); sg.id = 'asp-' + k; sg.setAttribute('role', 'group'); sg.setAttribute('aria-label', nomi[0]);

        b.addEventListener('click', function () { scelta[k] = o; anteprima = scelta; applicaAspetto(scelta); Array.prototype.forEach.call(sg.children, function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); }); }); sg.appendChild(b);
      });

    ok.addEventListener('click', function () {

      closeSheet();
      deveOk(dati).then(function () {

        toast('Aspetto applicato', function () { var a = { azione: 'aspetto' }; Object.keys(ASPETTO_OPZIONI).forEach(function (k) { a['a_' + k] = era[k] || ASPETTO_OPZIONI[k][0]; }); return deveOk(a).then(function () { aspettoSalvato = era; store.set('aspetto', era); applicaAspetto(era); }); });
      }, function (e) { applicaAspetto(aspettoSalvato); toast('Non applicato: ' + umano(e)); });

document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

// ---------- avvio, aggiornamenti ----------
var firmaCalendario = null;
function carica() {
  var io = ++giro;
  return fetch(SERVER, { signal: timeout(30000) }).then(function (r) { return r.json(); }).then(function (res) {
    if (!res || !res.ok || !Array.isArray(res.voti)) throw new SyntaxError('risposta');
    var w = !VOTI ? Math.max(0, 1500 - (Date.now() - T_AVVIO)) : 0; // la prima volta l'animazione resta visibile almeno 1,5 s
    return w ? new Promise(function (ok) { setTimeout(function () { ok(res); }, w); }) : res;
  }).then(function (res) {
    if (io !== giro) return;
    ultimoGet = Date.now();
    if ((res.paginaMinima || 0) > VERSIONE && !S.invio) { // pagina vecchia rispetto al server: si ricarica da sola, una volta, con la bozza salvata
      var gia = false;
      try { gia = sessionStorage.getItem('ricarica') === String(res.paginaMinima); sessionStorage.setItem('ricarica', String(res.paginaMinima)); } catch (e) { gia = true; }
      if (!gia) { salvaBozza(); location.reload(); return; }
    }
    var nuovaFirmaCalendario = JSON.stringify([res.voti, res.aperti, res.tutti, res.oggi, res.chiuso, res.dataScelta]);
    var calendarioCambiato = nuovaFirmaCalendario !== firmaCalendario;
    firmaCalendario = nuovaFirmaCalendario;
    VOTI = res.voti; aperti = res.aperti; TUTTI = res.tutti; INVITATI = res.invitati || []; OGGI = res.oggi || OGGI;
    DECISA = res.chiuso ? res.dataScelta : ''; SCAD = res.scadenza || ''; S.letturaKo = false;
    store.set('cachePagina', { quando: Date.now(), voti: res.voti, aperti: res.aperti, tutti: res.tutti, invitati: res.invitati || [], oggi: res.oggi || OGGI, chiuso: !!res.chiuso, dataScelta: res.dataScelta || '', scadenza: res.scadenza || '', aspetto: res.aspetto || {} });
    aspettoSalvato = res.aspetto || {}; store.set('aspetto', aspettoSalvato); if (!anteprima) applicaAspetto(aspettoSalvato);
    var passo2 = ADMIN ? chiama({ azione: 'verifica' }).then(function (v) {
      if (v.ok) { adminOk = true; privati = Object.create(null); Object.keys(v.privati || {}).forEach(function (n) { privati[norm(n)] = v.privati[n]; }); CESTINO = v.cestino || []; } else { ADMIN = ''; adminOk = false; }
    }, function () { /* rete: si riprova al prossimo caricamento */ }) : Promise.resolve();
    return passo2.then(function () {
      if (io !== giro) return;
      if (!S.invio) {
        // il voto salvato sul server non c'e' piu' (eliminato da Gilberto): si torna al modulo vuoto
        if (S.voted && !S.edit && !votoDi(S.me)) { var nm = S.nome; S = nuovoS(); S.nome = nm; calendarioCambiato = true; }
        applicaVotoMio();
        if (S.nome.trim() && !S.voted && !S.adminEdit) controllaNome();
      }
      renderAll(!calendarioCambiato);
      document.body.setAttribute('data-pronto', '1'); // voti arrivati (i test aspettano questo)
      if (coda() && !S.invio) invia(true); // voto rimasto in coda (rete giu'): riparte da solo, stesso id
    });
  }).catch(function () {
    if (io !== giro) return;
    if (!VOTI) { S.letturaKo = true; renderStato(); }
  });
}
// Dati vecchi: la pagina che torna visibile dopo piu' di un minuto ricarica i voti; torna la rete: parte il voto in coda.
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && Date.now() - ultimoGet > RICARICA_MS && !S.invio) carica(); });
setInterval(function () { if (document.visibilityState === 'visible' && Date.now() - ultimoGet >= AGGIORNA_LIVE_MS && !S.invio && !S.dirty && !S.edit && !S.adminEdit) carica(); }, 5000);
window.addEventListener('resize', function () { renderFila(); });
window.addEventListener('online', function () { if (coda() && !S.invio) invia(true); });
document.addEventListener('focusin', function (e) { var id = e.target.id; if (id === 'commento' || id === 'chiave') setTimeout(function () { try { e.target.scrollIntoView({ block: 'center' }); } catch (x) {} }, 300); });

// Bozza non inviata (ricarica, indietro, telefono spento): si riprende da dove si era. Viene dal telefono, anche da una versione vecchia: valori non validi = un tocco.
(function () {
  var bz = store.get('bozza');
  if (bz && typeof bz === 'object' && bz.scelte && typeof bz.scelte === 'object' && (Object.keys(bz.scelte).length || bz.nome)) {
    S.nome = String(bz.nome || ''); S.avatar = AVATARI.indexOf(bz.avatar) >= 0 ? bz.avatar : ''; S.commento = String(bz.commento || '').slice(0, MAX_COMMENTO); S.pubblico = !!bz.pubblico;
    S.commToccato = !!bz.commToccato; S.vecchio = String(bz.vecchio || ''); S.keyNew = String(bz.keyNew || ''); S.dirty = true;
    Object.keys(bz.scelte).forEach(function (g) { if (/^\d{4}-\d\d-\d\d$/.test(g)) S.scelte[g] = VALIDO.test(bz.scelte[g]) ? bz.scelte[g] : TOCCO; });
  }
  renderAll();
  carica();
})();
